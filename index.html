<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>리바운드부동산중개 종로센터 · 매물장</title>
<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
#dAddr{padding:0;max-width:520px;overflow:hidden}
#dAddr .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--pt2);font-weight:700;font-size:16px}
#dAddr .hd .sp{flex:1}
#dAddr .hd button.x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--ink)}
#dAddr .hd .lnk{border:1px solid var(--pt);color:var(--pt);background:#fff;border-radius:99px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:700}
#dAddr .lk{display:none;padding:8px 14px;gap:6px;border-bottom:1px solid var(--line)}#dAddr .lk.on{display:flex}
#pc{height:440px;width:100%}
.fp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px;font-size:13px}
.fp h3{margin:0 0 6px;font-size:13px;color:var(--pt)}
.fp .row{display:grid;grid-template-columns:78px 1fr 70px;gap:6px;align-items:center;margin:2px 0;font-size:12px}
.fp .bar{height:9px;background:var(--pt2);border-radius:5px;overflow:hidden;position:static;border:0;padding:0;display:block}.fp .bar i{display:block;height:100%;background:var(--pt)}
.fp .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:8px}
.fp small{color:var(--sub)}
.fleg{position:absolute;left:8px;bottom:8px;z-index:5;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px;color:var(--ink)}.fleg i{display:inline-block;width:22px;height:10px}.fball{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12);transform:translateY(-6px);white-space:nowrap}

#map{position:relative;height:260px;border:1px solid var(--line);border-radius:10px;margin-top:8px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;text-align:center;padding:10px}
:root{--bg:#f6f4f0;--card:#fdfcfa;--ink:#3d4048;--sub:#80838c;--line:#e6e1d9;--pt:#e8603c;--pt2:#fbebe5;--ok:#059669;--warn:#c08a4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{display:flex;align-items:center;gap:18px;padding:12px 22px;background:#fff;border-bottom:3px solid var(--pt);position:sticky;top:0;z-index:5}
header h1{font-size:22px;margin:0;font-weight:800;line-height:1.2;color:#2a2d33;display:flex;align-items:center;gap:14px}header h1 .lg{width:48px;height:48px;border-radius:11px;background:var(--pt);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;flex:none}header h1 small{display:block;font-size:13px;letter-spacing:.2em;color:var(--pt);font-weight:800}header h1 em{font-style:normal;font-weight:500;color:var(--sub);margin-left:8px;font-size:17px}
header .sp{flex:1}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,.btn.pt{background:var(--pt);border-color:var(--pt);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
main{max-width:1000px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 12px;color:var(--pt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.f{display:flex;flex-direction:column;gap:3px}
.f.w2{grid-column:span 2}.f.wall{grid-column:1/-1}
.f label{font-size:12px;color:var(--sub)}
input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;color:var(--ink);background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pt2);border-color:var(--pt)}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;font-size:13px;color:var(--ink);cursor:pointer}
.chips input{width:auto}
.pair{display:flex;gap:6px;align-items:center}.pair span{font-size:12px;color:var(--sub);white-space:nowrap}
.types{display:flex;gap:8px;margin-bottom:14px}
.types button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font:inherit;font-weight:700;color:var(--sub);cursor:pointer}
.types button.on{background:var(--pt2);border-color:var(--pt);color:var(--pt)}
.bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.bar .msg{flex:1;font-size:13px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600;font-size:12px}
tr.row{cursor:pointer}tr.row:hover{background:var(--pt2)}
.tag{display:inline-block;background:var(--pt2);color:var(--pt);border-radius:6px;padding:1px 7px;font-size:11px;margin-right:3px}
.hid{display:none!important}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.setup{text-align:center;padding:40px 20px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:5px 10px;font-size:13px}.kv b{color:var(--sub);font-weight:600}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:640px;width:92%}
pre{background:#fff;border:1px solid var(--line);padding:10px;border-radius:8px;overflow:auto;max-height:260px;font-size:12px}
</style>

<body>
<header>
  <h1><span class="lg">R</span><span><small>REBOUND</small>(주)리바운드부동산중개 종로센터<em>매물장</em></span></h1>
  <nav><button id="nR" class="on">매물등록</button> <button id="nL">내 폴더 목록</button> <button id="nS">공유DB</button></nav>
  <span class="sp"></span>
  <span id="rootName" style="color:var(--sub);font-size:12px"></span>
  <button class="btn sm" id="bSet">설정</button>
</header>
<main id="main"></main>

<dialog id="dSet">
  <h2 style="margin-top:0;font-size:15px">설정</h2>
  <p style="font-size:13px;color:var(--sub)">구글 스프레드시트 연동은 Apps Script 웹앱 주소를 넣으면 저장할 때 자동으로 행이 추가·수정됩니다. 비워 두면 폴더와 매물DB.csv에만 저장합니다.</p>
  <div class="f"><label>Apps Script 웹앱 URL</label><input id="sUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
  <div class="f" style="margin-top:8px"><label>카카오 지도 JavaScript 키</label><input id="sKey" placeholder="카카오 디벨로퍼스 > 앱 > JavaScript 키"></div>
  <div class="f" style="margin-top:8px"><label>기본 담당자</label><input id="sMgr" placeholder="RB 종로센터 김세리 대표"></div>
  <div style="margin-top:12px;display:flex;gap:8px;justify-content:space-between">
    <button class="btn sm" id="bRoot">저장 위치 다시 선택</button>
    <span><button class="btn sm" id="bScript">Apps Script 코드 보기</button> <button class="btn pt sm" id="bSetOk">확인</button></span>
  </div>
</dialog>
<dialog id="dAddr">
  <div class="hd"><span>📍 주소 검색</span><span class="sp"></span><button class="lnk" id="bLink">외부 링크로 가져오기</button><button class="x" id="bAddrX">×</button></div>
  <div class="lk" id="lk"><input id="lkUrl" placeholder="외부 매물 링크 붙여넣기"><button class="btn sm pt" id="lkOk">저장</button></div>
  <div id="pc"></div>
</dialog>
<dialog id="dScript"><h2 style="margin-top:0;font-size:15px">Apps Script 코드</h2>
<p style="font-size:13px;color:var(--sub)">새 구글 스프레드시트 → 확장 프로그램 → Apps Script에 붙여넣고 배포 → 웹 앱(액세스: 모든 사용자)으로 배포한 뒤 URL을 설정에 넣으세요.</p>
<pre id="scriptCode"></pre><div style="margin-top:10px;text-align:right"><button class="btn sm" id="bCopy">복사</button> <button class="btn sm" id="bScriptX">닫기</button></div></dialog>

<script>
/* ===== 스키마 ===== */
const MGRS=['RB 종로센터 김세리 대표','RB 종로센터 윤영일','RB 종로센터 박효주 팀장','RB 종로센터 김미정 팀장','RB 종로센터 송유빈 실장','RB 종로센터 김효진 팀장','RB 종로센터 허성문','RB 종로센터 문종열 실장'];
const SIDO=['서울','부산','대구','인천','대전','울산','강원','경기','경남','경북','전남광주','전북','제주','충남','충북','세종'];
const T3=['상가점포','주거','사무실'];
const DIRS=['동','서','남','북','남동','남서','북서','북동'];
const CUS=['매도인','임대인','매수인','임차인','관리인','대리인','중개사','기타'];
const S=(s)=>({sec:s});
const SCHEMA=[
S('위치'),
{special:'addr'},
{k:'sido',l:'시/도',t:'sel',o:SIDO,def:'서울'},
{k:'gu',l:'구/군',def:'종로구'},
{k:'dong',l:'동/읍/면'},
{k:'jibun',l:'상세주소 (지번·동·호)',w:2},
{k:'road',l:'도로명주소',w:2},
{k:'zip',l:'우편번호'},
{k:'lat',l:'위도',t:'ro'},
{k:'lng',l:'경도',t:'ro'},
{k:'srcLink',l:'외부 링크',w:2},
{k:'bldg',l:'건물명'},
{k:'room',l:'호실 (예: 201호)'},
{k:'roompub',l:'호실공개',t:'sel',o:['공개','비공개'],def:'비공개'},
S('금액'),
{k:'deal',l:'거래형태',t:'sel',o:['월세','매매','전세'],def:'월세'},
{k:'range',l:'거래범위',t:'sel',o:['건물 일부','건물 전체'],def:'건물 일부'},
{k:'vat',l:'부가세',t:'sel',o:['','포함','별도']},
{k:'price',l:'매매가·전세금 (만원)',t:'num',when:d=>d.deal!=='월세'},
{k:'deposit',l:'보증금 (만원)',t:'num',when:d=>d.deal==='월세'},
{k:'rent',l:'월세 (만원)',t:'num',when:d=>d.deal==='월세'},
{k:'premium',l:'권리금 (만원)',t:'num',types:['상가점포']},
{k:'premiumType',l:'권리금 구분',t:'sel',o:['','있음','없음','협의가능'],types:['상가점포']},
{k:'mgmt',l:'관리비 (원)',t:'num'},
{k:'mgmtIncl',l:'관리비 포함내역',t:'multi',o:['인터넷','TV','수도','공동전기','청소','엘리베이터'],w:'all'},
S('매물 정보'),
{k:'manager',l:'담당자',t:'sel',o:MGRS},
{k:'pub',l:'매물 공개 여부',t:'sel',o:['비공개','공개'],def:'비공개'},
{k:'status',l:'거래 상태',t:'sel',o:['진행중','거래완료','보류·종료'],def:'진행중'},
{k:'viol',l:'위반건축물',t:'sel',o:['','위반 아님','위반 건물']},
{k:'tags',l:'태그',t:'multi',o:['추천','전속','공실','퇴거예정','미등기건물','급매'],w:'all'},
{k:'theme',l:'테마',t:'multi',w:'all',o:['사무실','자유업종','휴게음식점','일반음식점','지하 매물','탑층 매물','일층 매물','무권리 점포','단기 임대','공실 상가','소형평수','중형평수','대형평수','꼬마 빌딩','소방완비','호스텔 용도변경 가능'],types:['상가점포','사무실']},
{k:'options',l:'옵션',t:'multi',w:'all',o:['에어컨','세탁기','냉장고','침대','책상','옷장','신발장','싱크대','인덕션','가스레인지','전자레인지','욕조','도어락','인터폰','CCTV','베란다','도시가스','엘리베이터(일반)','주차(자주식)'],types:['주거']},
S('기본 정보'),
{k:'supply',l:'공급면적',t:'area'},
{k:'excl',l:'전용면적',t:'area'},
{k:'ratio',l:'전용률 (%)',t:'ro'},
{k:'floorKind',l:'층 구분',t:'sel',o:['지상','지하','반지하','옥탑','지층'],def:'지상'},
{k:'floor',l:'해당층',t:'num'},
{k:'totalFloor',l:'총층',t:'num'},
{k:'rooms',l:'방 (개)',t:'num',types:['주거']},
{k:'baths',l:'화장실 (개)',t:'num',types:['주거']},
{k:'dir',l:'방향',t:'sel',o:['',...DIRS]},
{k:'parking',l:'주차',t:'sel',o:['','가능','불가능']},
{k:'parkCnt',l:'주차 대수',t:'num'},
{k:'moveIn',l:'입주가능일',def:'협의가능',ph:'협의가능 / 즉시 / 2026-12-01'},
{k:'interior',l:'인테리어',t:'sel',o:['','있음','없음']},
{k:'bldgType',l:'건물 형태',t:'sel',o:['','단지내 상가','일반상가','복합상가'],types:['상가점포']},
{k:'bldgType2',l:'건물 형태',t:'sel',o:['','소형사무실','중소형사무실','중형사무실','중대형사무실','대형사무실','오피스','오피스텔형','지식산업센터'],types:['사무실'],key:'bldgType'},
{k:'heating',l:'난방',t:'sel',o:['','개별난방','지역난방','도시가스','중앙난방','전기','심야전기','기름보일러','LPG']},
{k:'elev',l:'엘리베이터 (대)',t:'num'},
{k:'mainUse',l:'주용도'},
{k:'useDate',l:'사용승인일',t:'date'},
{k:'seized',l:'압류여부',t:'sel',o:['없음','압류','가압류'],def:'없음'},
S('고객 정보'),
{k:'c1role',l:'고객1 구분',t:'sel',o:['',...CUS]},{k:'c1name',l:'고객1 이름'},{k:'c1phone',l:'고객1 연락처',priv:1},{k:'c1state',l:'고객1 상태',t:'sel',o:['','진행','계약','보류','종료']},
{k:'c2role',l:'고객2 구분',t:'sel',o:['',...CUS]},{k:'c2name',l:'고객2 이름'},{k:'c2phone',l:'고객2 연락처',priv:1},{k:'c2state',l:'고객2 상태',t:'sel',o:['','진행','계약','보류','종료']},
S('추가 정보'),
{k:'center',l:'센터',t:'sel',o:['RB종로','RB중구','RB강남','RB마포','RB서대문','RB은평','본점','MH종로','MH중구','MH마포','MH용산'],def:'RB종로'},
{k:'naver',l:'네이버광고',t:'sel',o:['미진행','진행중']},
{k:'note1',l:'비고1'},{k:'note2',l:'비고2'},
S('상세 정보 · 사진'),
{k:'title',l:'제목',w:'all'},
{k:'mgmtNo',l:'자체관리번호'},
{k:'desc',l:'상세정보',t:'area2',w:'all'},
{k:'secret',l:'비밀메모',t:'area2',w:'all',priv:1},
];
const TYPE_DEFAULT_SUBTYPE={상가점포:'상가·사무실',주거:'원투룸·오피스텔',사무실:'상가·사무실'};
const SHEET_EXCLUDE=['c1role','c1name','c1phone','c1state','c2role','c2name','c2phone','c2state','secret'];

/* ===== 상태 ===== */
let root=null, curType='상가점포', photos=[], files=[];
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=s=>String(s||'').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim();
const cfg=()=>JSON.parse(localStorage.getItem('mmj-cfg')||'{}');

/* IndexedDB: 폴더 핸들 보관 */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('mmj',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function kvGet(k){const d=await idb();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function kvSet(k,v){const d=await idb();return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r()})}

async function pickRoot(){
  root=await showDirectoryPicker({mode:'readwrite'});
  await kvSet('root',root); $('#rootName').textContent='저장위치: '+root.name;
}
async function ensureRoot(interactive){
  if(!root){root=await kvGet('root')||null}
  if(root){
    let p=await root.queryPermission({mode:'readwrite'});
    if(p!=='granted'&&interactive) p=await root.requestPermission({mode:'readwrite'});
    if(p==='granted'){$('#rootName').textContent='저장위치: '+root.name;return true}
  }
  if(interactive){await pickRoot();return true}
  return false;
}
async function sub(h,parts){for(const p of parts)h=await h.getDirectoryHandle(p,{create:true});return h}
async function writeFile(dir,name,data){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(data);await w.close()}

/* ===== 폼 렌더 ===== */
function fieldHTML(f){
  const id='f_'+f.k, w=f.w==='all'?'wall':(f.w===2?'w2':'');
  let h='';
  if(f.t==='sel') h=`<select id="${id}">${f.o.map(o=>`<option ${o===f.def?'selected':''}>${esc(o)}</option>`).join('')}</select>`;

let kmap=null,kmarker=null,kgeo=null,kLoading=null;
function loadKakao(key){
  if(window.kakao&&kakao.maps&&kakao.maps.services) return Promise.resolve();
  if(kLoading) return kLoading;
  kLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
    s.onload=()=>kakao.maps.load(res); s.onerror=()=>{kLoading=null;rej(new Error('지도 SDK 로드 실패'))};
    document.head.append(s);
  });
  return kLoading;
}
async function initMap(){
  const box=$('#map'); if(!box) return;
  const key=cfg().kakao;
  if(!key){box.textContent='지도를 보려면 설정에서 카카오 JavaScript 키를 입력하세요.';return}
  if(location.protocol==='file:'){box.textContent='지도는 실행.bat으로 연 주소(localhost)에서만 보입니다.';return}
  try{
    await loadKakao(key); box.textContent='';
    kmap=new kakao.maps.Map(box,{center:new kakao.maps.LatLng(37.5704,126.9922),level:3});
    kmarker=new kakao.maps.Marker({position:kmap.getCenter(),map:kmap});
    kgeo=new kakao.maps.services.Geocoder();
    kakao.maps.event.addListener(kmap,'click',e=>{const p=e.latLng;kmarker.setPosition(p);setV('lat',p.getLat().toFixed(6));setV('lng',p.getLng().toFixed(6))});
    const q=$('#f_road').value||($('#f_dong').value+' '+$('#f_jibun').value); if(q.trim()) geocode(q);
  }catch(e){box.textContent='지도 오류: '+e.message+' (키·등록 도메인을 확인하세요)'}
}
function geocode(q){
  if(!kgeo||!q) return;
  kgeo.addressSearch(q,(r,st)=>{
    if(st!==kakao.maps.services.Status.OK||!r[0]) return;
    const p=new kakao.maps.LatLng(r[0].y,r[0].x);
    kmap.setCenter(p);kmarker.setPosition(p);setV('lat',(+r[0].y).toFixed(6));setV('lng',(+r[0].x).toFixed(6));
  });
}
function ratio(){const a=parseFloat($('#f_supply').value),b=parseFloat($('#f_excl').value);$('#f_ratio').value=a&&b?(b/a*100).toFixed(1):''}

const today=()=>{const n=new Date();const p=x=>String(x).padStart(2,'0');return{ymd:String(n.getFullYear()).slice(2)+p(n.getMonth()+1)+p(n.getDate()),iso:`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`}};
const STATUS_DIR={'진행중':'01_진행중','거래완료':'02_계약완료','보류·종료':'03_보류·종료'};
async function walkItems(){
  const out=[]; if(!root) return out;
  let base; try{base=await root.getDirectoryHandle('매물장')}catch{return out}
  for await(const [sn,sh] of base.entries()){ if(sh.kind!=='directory'||!/^0\d_/.test(sn)) continue;
    for await(const [tn,th] of sh.entries()){ if(th.kind!=='directory') continue;
      for await(const [nn,nh] of th.entries()){ if(nh.kind!=='directory') continue; out.push({name:nn,dir:nh,status:sn,type:tn}) } } }
  return out;
}
async function nextNo(ymd){
  const items=await walkItems(); let mx=0;
  for(const it of items){const m=it.name.match(/^RB-(\d{6})-(\d{3})/);if(m&&m[1]===ymd) mx=Math.max(mx,+m[2])}
  const u=cfg().url;
  if(u){try{const r=await fetch(u+'?action=next&ymd='+ymd);const j=await r.json();mx=Math.max(mx,+j.max||0)}catch(e){}}
  return `RB-${ymd}-${String(mx+1).padStart(3,'0')}`;
}
function csvCell(v){v=Array.isArray(v)?v.join('|'):String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function sheetRow(rec){
  const cols=['매물번호','등록일','유형',...SCHEMA.filter(f=>!f.sec&&f.k&&!SHEET_EXCLUDE.includes(f.k)&&f.k!=='bldgType2').map(f=>f.k),'사진수','폴더경로'];
  return {cols,row:cols.map(c=>c==='매물번호'?rec.no:c==='등록일'?rec.created:c==='유형'?rec.type:c==='사진수'?rec.photoCount:c==='폴더경로'?rec.path:(rec.data[c]??''))};
}
async function appendCsv(rec){
  const {cols,row}=sheetRow(rec);
  let text=''; try{const fh=await root.getFileHandle('매물DB.csv');text=await (await fh.getFile()).text()}catch{}
  if(!text) text='﻿'+cols.map(csvCell).join(',')+'\n';
  text+=row.map(csvCell).join(',')+'\n';
  await writeFile(root,'매물DB.csv',text);
}
async function pushSheet(rec){
  const url=cfg().url; if(!url) return '시트 미연동';
  const {cols,row}=sheetRow(rec);
  try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({cols,row,key:rec.no})});return '시트 전송 요청 완료'}catch(e){return '시트 전송 실패: '+e.message}
}
function md(rec){
  const d=rec.data,L=[];
  L.push(`# ${rec.no} ${d.title||''}`,'',`- 유형: ${rec.type} / ${d.deal}`,`- 소재지: ${d.sido} ${d.gu} ${d.dong} ${d.jibun} ${d.bldg}`.trim());
  const money=d.deal==='월세'?`보증금 ${d.deposit||'-'} / 월세 ${d.rent||'-'} (만원)`:`${d.deal==='매매'?'매매가':'전세금'} ${d.price||'-'}만원`;
  L.push(`- 금액: ${money}`+(d.premium?` / 권리금 ${d.premium}만원`:'')+(d.mgmt?` / 관리비 ${d.mgmt}원`:''));
  L.push(`- 면적: 공급 ${d.supply||'-'}㎡(${d.supply_pyeong||'-'}평) / 전용 ${d.excl||'-'}㎡(${d.excl_pyeong||'-'}평) / 전용률 ${d.ratio||'-'}%`);
  L.push(`- 층: ${d.floorKind} ${d.floor||'-'}층 / 총 ${d.totalFloor||'-'}층`,`- 입주: ${d.moveIn||'-'}`,`- 담당: ${d.manager}`,`- 상태: ${d.status} / ${d.pub}`,`- 태그: ${(d.tags||[]).join(', ')||'-'}`,'',`## 상세정보`,d.desc||'','', `> 등록일 ${rec.created}`);
  return L.join('\n');
}
async function save(){
  const msg=$('#msg'); const d=getD(); d.type=curType;
  if(!d.dong&&!d.jibun){msg.textContent='소재지(동 또는 상세주소)를 입력해 주세요.';return}
  try{
    msg.textContent='중복 확인 중...';
    const dp=await findDup(d);
    if(dp.hit&&dp.hit.length){
      const open=dp.hit.filter(r=>!/계약완료|종료/.test(r.status||''));
      if(open.length){msg.innerHTML='⚠ 이미 등록된 매물이라 저장할 수 없습니다: '+dupMsg(dp.hit);checkDup();return}
      if(!confirm('같은 주소·층·호실의 매물이 있으나 모두 계약완료/종료 상태입니다.\n재등록하시겠습니까?')){msg.textContent='저장을 취소했습니다.';return}
    }
    if(dp.fail) msg.textContent='중복 확인 실패(공유 DB 연결 확인) — 그대로 저장합니다...';
    if(!(await ensureRoot(true))){msg.textContent='저장 위치가 필요합니다.';return}
    msg.textContent='저장 중...';
    const t=today(), no=await nextNo(t.ymd);
    const addr=clean(`${d.dong}${d.jibun?' '+d.jibun:''}`).replace(/\s/g,'')||'주소미상';
    const folder=`${no}_${addr}_${curType}${d.floor?'_'+d.floor+'층':''}`;
    const statusDir=STATUS_DIR[d.status]||'01_진행중';
    const item=await sub(root,['매물장',statusDir,curType,folder]);

    for(const f of files) await writeFile(docDir,clean(f.name),f);

    await writeFile(item,'매물정보.json',JSON.stringify(rec,null,2));
    await writeFile(item,'매물장.md',md(rec));
    await appendCsv(rec);
    const s=await pushSheet(rec);

    msg.textContent=`✔ ${no} 저장 완료 (${[s,sp,ph].filter(Boolean).join(' · ')})`;
    photos=[];files=[];
  }catch(e){msg.textContent='저장 실패: '+e.message}
}

async function shrink(f){
  try{
    const bm=await createImageBitmap(f),sc=Math.min(1,1600/Math.max(bm.width,bm.height));
    const c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
  }catch(e){return f.size<3e6?f:null}
}
const b64=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(String(x.result).split(',')[1]);x.readAsDataURL(b)});

/* ===== 중복 매물 확인 (공유 DB 기준: 동+지번+층+호실) ===== */
let dupCache={t:0,rows:null};
const nz=s=>String(s??'').replace(/\s/g,'').replace(/호$/,'');
const dupKey=d=>[nz(d.sido),nz(d.gu),nz(d.dong),nz(d.jibun),nz(d.floorKind),nz(d.floor),nz(d.room)].join('|');
async function sheetRows(){
  const url=cfg().url; if(!url) return null;
  if(dupCache.rows&&Date.now()-dupCache.t<30000) return dupCache.rows;
  const j=await (await fetch(url+'?action=list')).json();
  dupCache={t:Date.now(),rows:j.rows.map(r=>Object.fromEntries(j.cols.map((c,i)=>[c,r[i]])))};
  return dupCache.rows;
}
async function findDup(d){
  if(!d.dong&&!d.jibun) return {skip:1};
  let rows; try{rows=await sheetRows()}catch(e){return {fail:e.message}}
  if(!rows) return {nourl:1};
  const k=dupKey(d); return {hit:rows.filter(r=>dupKey(r)===k)};
}
function dupMsg(h){return h.map(r=>`<b>${esc(r['매물번호'])}</b> · ${esc(r.status||'')} · 담당 ${esc(String(r.manager||'').replace('RB 종로센터 ',''))}`).join('<br>')}
async function checkDup(){
  const box=$('#dup'); if(!box) return;
  const r=await findDup(getD());
  if(r.hit&&r.hit.length) box.innerHTML=`<div class="fp" style="border-color:var(--pt);background:var(--pt2)">⚠ 이미 등록된 매물입니다 (같은 주소·층·호실)<br>${dupMsg(r.hit)}<br><small>이 상태로는 저장되지 않습니다. 호실·층이 다르면 해당 칸을 수정하세요.</small></div>`;
  else if(r.hit) box.innerHTML='<div class="fp" style="border-color:var(--ok)">✔ 공유 DB에 같은 매물이 없습니다.</div>';
  else box.innerHTML='';
}

const APPS_SCRIPT=`var SEOUL_KEY=PropertiesService.getScriptProperties().getProperty('SEOUL_KEY')||'';
function J(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);}
function sheet_(){var ss=SpreadsheetApp.getActiveSpreadsheet();return ss.getSheetByName('매물DB')||ss.insertSheet('매물DB');}
function seoul_(svc,a,b,extra){
  var u='http://openapi.seoul.go.kr:8088/'+SEOUL_KEY+'/json/'+svc+'/'+a+'/'+b+'/'+(extra||'');
  var r=JSON.parse(UrlFetchApp.fetch(u,{muteHttpExceptions:true}).getContentText());
  return r[svc]||r;
}
function trdars_(){
  var c=CacheService.getScriptCache(), n=c.get('tr_n');
  if(n){var s='';for(var i=0;i<+n;i++)s+=c.get('tr_'+i);return JSON.parse(s);}
  var all=[];
  for(var st=1;st<=2000;st+=1000){
    var d=seoul_('TbgisTrdarRelm',st,st+999); if(!d.row)break;
    d.row.forEach(function(r){all.push([r.TRDAR_CD,r.TRDAR_CD_NM,+r.XCNTS_VALUE,+r.YDNTS_VALUE,r.SIGNGU_CD_NM,r.ADSTRD_CD_NM,r.TRDAR_SE_CD_NM]);});
  }
  var s2=JSON.stringify(all), parts=Math.ceil(s2.length/30000);
  for(var k=0;k<parts;k++)c.put('tr_'+k,s2.substr(k*30000,30000),21600);
  c.put('tr_n',String(parts),21600);
  return all;
}
function tm_(lat,lng){
  var a=6378137,f=1/298.257222101,e2=2*f-f*f,ep2=e2/(1-e2),lat0=38*Math.PI/180,lon0=127*Math.PI/180,phi=lat*Math.PI/180,lam=lng*Math.PI/180;
  var N=a/Math.sqrt(1-e2*Math.sin(phi)*Math.sin(phi)),T=Math.tan(phi)*Math.tan(phi),C=ep2*Math.cos(phi)*Math.cos(phi),A=(lam-lon0)*Math.cos(phi);
  function M(p){return a*((1-e2/4-3*e2*e2/64-5*e2*e2*e2/256)*p-(3*e2/8+3*e2*e2/32+45*e2*e2*e2/1024)*Math.sin(2*p)+(15*e2*e2/256+45*e2*e2*e2/1024)*Math.sin(4*p)-(35*e2*e2*e2/3072)*Math.sin(6*p));}
  var x=200000+N*(A+(1-T+C)*Math.pow(A,3)/6+(5-18*T+T*T+72*C-58*ep2)*Math.pow(A,5)/120);
  var y=500000+(M(phi)-M(lat0)+N*Math.tan(phi)*(A*A/2+(5-T+9*C+4*C*C)*Math.pow(A,4)/24+(61-58*T+T*T+600*C-330*ep2)*Math.pow(A,6)/720));
  return [x,y];
}
function foot_(lat,lng){
  if(!SEOUL_KEY||false)return {error:'서울시 인증키가 스크립트 속성(SEOUL_KEY)에 없습니다'};
  var p=tm_(+lat,+lng), best=null, bd=1e12;
  trdars_().forEach(function(t){var d=Math.sqrt(Math.pow(t[2]-p[0],2)+Math.pow(t[3]-p[1],2));if(d<bd){bd=d;best=t;}});
  if(!best)return {error:'상권 목록을 불러오지 못했습니다 (인증키 확인)'};
  var now=new Date(), y=now.getFullYear(), q=Math.ceil((now.getMonth()+1)/3);
  for(var i=0;i<10;i++){
    q--; if(q<1){q=4;y--;}
    var code=y+''+q, d=seoul_('VwsmTrdarFlpopQq',1,5,code+'/'+best[0]);
    if(d.row&&d.row.length)return {code:best[0],name:best[1],type:best[6],gu:best[4],dong:best[5],dist:Math.round(bd),quarter:code,data:d.row[0]};
  }
  return {error:'해당 상권의 유동인구 데이터를 찾지 못했습니다'};
}
function inv_(x,y){
  var a=6378137,f=1/298.257222101,e2=2*f-f*f,ep2=e2/(1-e2),lat0=38*Math.PI/180,lon0=127*Math.PI/180;
  function M(p){return a*((1-e2/4-3*e2*e2/64-5*e2*e2*e2/256)*p-(3*e2/8+3*e2*e2/32+45*e2*e2*e2/1024)*Math.sin(2*p)+(15*e2*e2/256+45*e2*e2*e2/1024)*Math.sin(4*p)-(35*e2*e2*e2/3072)*Math.sin(6*p));}
  var M1=M(lat0)+(y-500000), mu=M1/(a*(1-e2/4-3*e2*e2/64-5*e2*e2*e2/256)), s=Math.sqrt(1-e2), e1=(1-s)/(1+s);
  var p1=mu+(3*e1/2-27*Math.pow(e1,3)/32)*Math.sin(2*mu)+(21*e1*e1/16-55*Math.pow(e1,4)/32)*Math.sin(4*mu)+(151*Math.pow(e1,3)/96)*Math.sin(6*mu)+(1097*Math.pow(e1,4)/512)*Math.sin(8*mu);
  var N1=a/Math.sqrt(1-e2*Math.sin(p1)*Math.sin(p1)),T1=Math.tan(p1)*Math.tan(p1),C1=ep2*Math.cos(p1)*Math.cos(p1),R1=a*(1-e2)/Math.pow(1-e2*Math.sin(p1)*Math.sin(p1),1.5),D=(x-200000)/N1;
  var lat=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*Math.pow(D,4)/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*Math.pow(D,6)/720);
  var lon=lon0+(D-(1+2*T1+C1)*Math.pow(D,3)/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*Math.pow(D,5)/120)/Math.cos(p1);
  return [lat*180/Math.PI,lon*180/Math.PI];
}
function flpop_(){
  var c=CacheService.getScriptCache(), n=c.get('fp_n'), q=c.get('fp_q');
  if(n&&q){var s='';for(var i=0;i<+n;i++)s+=c.get('fp_'+i);return {quarter:q,m:JSON.parse(s)};}
  var now=new Date(), y=now.getFullYear(), qq=Math.ceil((now.getMonth()+1)/3);
  for(var t=0;t<10;t++){
    qq--; if(qq<1){qq=4;y--;}
    var code=y+''+qq, d=seoul_('VwsmTrdarFlpopQq',1,1000,code);
    if(!d.row||!d.row.length)continue;
    var rows=d.row, d2=seoul_('VwsmTrdarFlpopQq',1001,2000,code); if(d2.row)rows=rows.concat(d2.row);
    var m={};
    rows.forEach(function(r){m[r.TRDAR_CD]=[+r.TOT_FLPOP_CO,+r.ML_FLPOP_CO,+r.FML_FLPOP_CO,+r.AGRDE_10_FLPOP_CO,+r.AGRDE_20_FLPOP_CO,+r.AGRDE_30_FLPOP_CO,+r.AGRDE_40_FLPOP_CO,+r.AGRDE_50_FLPOP_CO,+r.AGRDE_60_ABOVE_FLPOP_CO];});
    var s2=JSON.stringify(m), parts=Math.ceil(s2.length/30000);
    for(var k=0;k<parts;k++)c.put('fp_'+k,s2.substr(k*30000,30000),21600);
    c.put('fp_n',String(parts),21600); c.put('fp_q',code,21600);
    return {quarter:code,m:m};
  }
  return null;
}
function footmap_(lat,lng,radius){
  if(!SEOUL_KEY||false)return {error:'서울시 인증키가 스크립트 속성(SEOUL_KEY)에 없습니다'};
  var p=tm_(+lat,+lng), R=Math.min(+radius||1000,3000), tr=trdars_(), fp=flpop_();
  if(!tr.length||!fp)return {error:'상권/유동인구 데이터를 불러오지 못했습니다 (인증키 확인)'};
  var list=[], best=null, bd=1e12;
  tr.forEach(function(t){
    var d=Math.sqrt(Math.pow(t[2]-p[0],2)+Math.pow(t[3]-p[1],2)), v=fp.m[t[0]];
    if(d<bd&&v){bd=d;best=t[0];}
    if(d<=R&&v){var ll=inv_(t[2],t[3]);list.push({code:t[0],name:t[1],type:t[6],gu:t[4],dong:t[5],lat:ll[0],lng:ll[1],dist:Math.round(d),v:v});}
  });
  return {quarter:fp.quarter,nearest:best,list:list};
}
function props_(){return PropertiesService.getScriptProperties();}
function sub_(parent,name){var it=parent.getFoldersByName(name);return it.hasNext()?it.next():parent.createFolder(name);}
function photoRoot_(){
  var id=props_().getProperty('PHOTO_ROOT'), f=null;
  if(id){try{f=DriveApp.getFolderById(id);}catch(e){}}
  if(!f){f=DriveApp.createFolder('매물장_사진');props_().setProperty('PHOTO_ROOT',f.getId());}
  return f;
}
function priv_(){
  var id=props_().getProperty('PRIV_ID'), ss=null;
  if(id){try{ss=SpreadsheetApp.openById(id);}catch(e){}}
  if(!ss){ss=SpreadsheetApp.create('매물장_고객DB(비공개)');props_().setProperty('PRIV_ID',ss.getId());}
  return ss;
}
function upsert_(sh,cols,row,key){
  if(sh.getLastRow()===0){sh.appendRow(cols);sh.setFrozenRows(1);}
  var head=sh.getRange(1,1,1,Math.max(sh.getLastColumn(),1)).getValues()[0].map(String);
  var add=cols.filter(function(c){return head.indexOf(c)<0;});
  if(add.length){sh.getRange(1,head.length+1,1,add.length).setValues([add]);head=head.concat(add);}
  var out=head.map(function(h){var i=cols.indexOf(h);return i<0?'':row[i];});
  var ids=sh.getLastRow()>1?sh.getRange(2,1,sh.getLastRow()-1,1).getValues().flat():[];
  var idx=ids.indexOf(key);
  if(idx>=0){sh.getRange(idx+2,1,1,out.length).setValues([out]);}else{sh.appendRow(out);}
}
function savePrivate_(p){var ss=priv_();upsert_(ss.getSheetByName('고객·비밀메모')||ss.insertSheet('고객·비밀메모'),p.cols,p.row,p.key);}
function savePhoto_(p){
  var f=sub_(photoRoot_(),p.no);
  f.createFile(Utilities.newBlob(Utilities.base64Decode(p.b64),p.mime||'image/jpeg',p.name));
}
function photos_(no){
  var it=photoRoot_().getFoldersByName(no); if(!it.hasNext())return {list:[]};
  var fs=it.next().getFiles(), l=[];
  while(fs.hasNext()){var x=fs.next();l.push({id:x.getId(),name:x.getName()});}
  l.sort(function(a,b){return a.name<b.name?-1:1;});
  return {list:l};
}
function photo_(id,thumb){
  var f=DriveApp.getFileById(id), pr=f.getParents();
  if(!pr.hasNext())return {error:'x'};
  var gp=pr.next().getParents();
  if(!gp.hasNext()||gp.next().getId()!==photoRoot_().getId())return {error:'권한 없음'};
  var b=null; if(thumb){try{b=f.getThumbnail();}catch(e){}}
  if(!b)b=f.getBlob();
  return {mime:b.getContentType(),b64:Utilities.base64Encode(b.getBytes())};
}
function 권한승인(){DriveApp.getRootFolder();SpreadsheetApp.create('권한확인_삭제해도됨').getId();photoRoot_();priv_();Logger.log('권한 승인 완료');}
function doGet(e){
  var a=(e.parameter||{}).action, sh=sheet_();
  if(a==='photos')return J(photos_(e.parameter.no));
  if(a==='photo')return J(photo_(e.parameter.id,e.parameter.thumb));
  if(a==='footmap')return J(footmap_(e.parameter.lat,e.parameter.lng,e.parameter.radius));
  if(a==='foot')return J(foot_(e.parameter.lat,e.parameter.lng));
  if(a==='next'){
    var mx=0, pre='RB-'+e.parameter.ymd+'-';
    if(sh.getLastRow()>1){sh.getRange(2,1,sh.getLastRow()-1,1).getValues().flat().forEach(function(v){v=String(v);if(v.indexOf(pre)===0)mx=Math.max(mx,parseInt(v.slice(pre.length),10)||0);});}
    return J({max:mx});
  }
  if(a==='list'){
    if(sh.getLastRow()<1)return J({cols:[],rows:[]});
    var v=sh.getDataRange().getDisplayValues();
    return J({cols:v[0],rows:v.slice(1)});
  }
  return J({ok:1});
}
function doPost(e){
  var p=JSON.parse(e.postData.contents);
  if(p.action==='photo'){savePhoto_(p);return J({ok:1});}
  var lock=LockService.getScriptLock();lock.waitLock(20000);
  try{
    if(p.action==='private'){savePrivate_(p);return J({ok:1});}
    upsert_(sheet_(),p.cols,p.row,p.key);
    return J({ok:1});
  }finally{lock.releaseLock();}
}
